<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandarinZen</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen transition-colors duration-300 font-sans bg-stone-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

  <!-- HEADER NAVBAR -->
  <header class="max-w-4xl mx-auto p-4 flex justify-between items-center border-b border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-2">
      <div class="bg-teal-500 text-white p-2 rounded-xl">
        <span class="font-bold text-xl">文</span>
      </div>
      <h1 class="text-xl font-bold tracking-wide">Mandarin<span class="text-teal-500 font-light">Zen</span></h1>
    </div>
    
    <div class="flex items-center gap-4">
      <nav class="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-full">
        <button 
          id="nav-flashcards"
          class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all bg-white dark:bg-slate-700 shadow-sm text-teal-600 dark:text-teal-400"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 3.44-2.14Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-3.44-2.14Z"></path></svg> 
          <span class="hidden sm:inline">Tarjetas</span>
        </button>
        <button 
          id="nav-memory"
          class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all opacity-70 hover:opacity-100"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="2"></rect></svg> 
          <span class="hidden sm:inline">Memoria</span>
        </button>
      </nav>
      
      <button 
        id="theme-toggle"
        class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition"
      >
        <svg id="sun-icon" class="hidden text-yellow-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
        <svg id="moon-icon" class="text-slate-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
    </div>
  </header>

  <!-- CATEGORY SELECTOR -->
  <div class="max-w-4xl mx-auto p-4">
    <div id="categories-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide snap-x"></div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <main class="max-w-4xl mx-auto p-4 pt-8">
    <div id="flashcards-view"></div>
    <div id="memory-view" class="hidden"></div>
  </main>

  <!-- Script Principal (Módulo ES6) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
